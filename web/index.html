<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuvquora · 聆聽服務室</title><link rel="stylesheet" href="style.css"><script src="contract.js" defer></script><script src="app.js" defer></script><body><header><a href="./">◒ NU VQUORA</a><span>虛構耳機・本機展示</span></header><main><aside><p class="eyebrow">SUPPORT / 01</p><h1>讓聲音，<br>回到日常。</h1><p>先確認型號，再一起釐清問題。每個回答都能回看依據。</p><label for="product">你的耳機</label><select id="product"><option value="">尚不確定型號</option><option value="hp-a">Nuvquora A</option><option value="hp-b">Nuvquora B</option></select><div class="disc" aria-hidden="true">◒</div><p class="note">合成商品與知識，非真實客服。請勿輸入個資；此處不處理訂單或退款。</p></aside><section class="workspace" aria-label="客服對話"><div class="toolbar"><strong>聆聽服務室</strong><button id="reset">開始新對話</button></div><div id="demo" hidden><label>展示情境 <select id="scenario"><option>answer</option><option>clarify</option><option>handoff</option><option>unavailable</option><option>error</option><option>source-superseded</option><option>source-withdrawn</option></select></label><b>DEMO ONLY · fixture，非模型回答</b></div><div id="messages" role="log" aria-live="polite"><article><small>服務助手</small><p>你好，想先解決哪個耳機問題？</p></article></div><p id="status" role="status"></p><button id="retry" hidden>重播上一輪（相同問題與 ID）</button><form><label for="message">描述遇到的問題</label><div class="composer"><textarea id="message" required maxlength="2000" rows="2" placeholder="例如：耳機無法重新配對"></textarea><button id="send">送出 ↗</button></div><small>最多 2,000 字・回答以可用來源為準</small></form></section></main><dialog aria-labelledby="source-title"><button id="close">關閉來源 ×</button><h2 id="source-title">知識來源</h2><p id="source-meta"></p><p id="source-text"></p></dialog></body></html>
