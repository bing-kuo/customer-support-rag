[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-rag"
version = "0.1.0"
description = "A synthetic customer support RAG proof of concept."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Acornsight" }]
dependencies = [
    "fastapi==0.162.2",
    "httpx==0.28.1",
    "numpy==2.3.5",
    "pydantic==2.14.3",
    "starlette==0.50.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
